name: CI

on:
  push:
  pull_request:

jobs:
  # Proves the API layer needs zero ML deps: no torch is installed here.
  backend-lite:
    name: Backend (light, no torch)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install light web deps + dev tooling
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pydantic sqlalchemy python-multipart \
            pillow httpx websockets aiofiles python-dotenv
          pip install -r backend/requirements-dev.txt

      - name: Run light test suite (no heavy, no gpu)
        run: |
          cd backend
          pytest -m "not heavy and not gpu" -q

  # Runs the MVCRM CPU test, which needs torch + numpy + plyfile + ML deps.
  backend-heavy:
    name: Backend (heavy, CPU torch)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install CPU torch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install ML deps + light web deps + dev tooling
        run: |
          pip install numpy plyfile scipy omegaconf tqdm pillow
          pip install fastapi "uvicorn[standard]" pydantic sqlalchemy python-multipart \
            httpx websockets aiofiles python-dotenv
          pip install -r backend/requirements-dev.txt

      - name: Run heavy test suite
        run: |
          cd backend
          pytest -m heavy -q

  frontend:
    name: Frontend (build + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Typecheck
        run: |
          cd frontend
          npx tsc -b

      - name: Build
        run: |
          cd frontend
          npm run build

  # Style nits should not fail CI: continue-on-error keeps this advisory only.
  lint:
    name: Lint (ruff, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff
        run: ruff check backend ai_modules scripts || true
